apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8082"
    spec:
      securityContext:
        runAsNonRoot: true
        # The image's USER is the name "freshchain"; kubelet can only verify
        # non-root from a numeric uid, so state the one the Dockerfile creates.
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory-service
          image: freshchain/inventory-service
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: freshchain-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/freshchain_inventory
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freshchain-secrets
                  key: postgres-password
            - name: FRESHCHAIN_SUBSTITUTION_ENABLED
              value: "true"
          startupProbe:
            httpGet: {path: /actuator/health, port: 8082}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8082}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8082}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 1536Mi}
      volumes:
        - name: tmp
          emptyDir: {}

# Postgres runs in-cluster because the free tier has no managed database.
# A StatefulSet gives it a stable identity and a PersistentVolumeClaim that
# survives pod restarts — but a single replica is still a single instance:
# backups (Phase 07 of the Ship Manual) are what protect the data.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          # Same image the tests run against — pgvector included.
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: freshchain
            - name: POSTGRES_DB
              value: freshchain
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freshchain-secrets
                  key: postgres-password
            # Keep data out of the volume root so the PVC's lost+found
            # directory does not trip initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "freshchain", "-d", "freshchain"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "freshchain", "-d", "freshchain"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi

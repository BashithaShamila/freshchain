# Template only — copy to secrets.yaml (gitignored), fill in real values, and
# apply it once by hand. The namespace has to exist first, so the first-ever
# deploy runs `kubectl apply -k k8s/base` before this (pods simply wait until
# the Secret appears):
#
#   cp secrets.example.yaml secrets.yaml
#   kubectl apply -n freshchain -f secrets.yaml
#
# Secrets travel out of band on purpose: the manifests in git reference this
# Secret by name but never contain its values.
apiVersion: v1
kind: Secret
metadata:
  name: freshchain-secrets
  namespace: freshchain
type: Opaque
stringData:
  postgres-password: CHANGE_ME   # e.g. openssl rand -base64 24
